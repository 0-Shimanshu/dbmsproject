<!DOCTYPE html>
<html>
<head>
    <title>Test Approvals API</title>
</head>
<body>
    <h1>Test Approvals API</h1>
    <button onclick="testLogin()">1. Login as Manager</button>
    <button onclick="testPendingApprovals()">2. Get Pending Approvals</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        let token = '';

        async function testLogin() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'manager1', password: 'password123' })
                });
                const data = await response.json();
                token = data.token;
                output.textContent = 'Login Response:\n' + JSON.stringify(data, null, 2);
                console.log('Token:', token);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        async function testPendingApprovals() {
            try {
                const response = await fetch('/api/approvals/pending', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                output.textContent = 'Pending Approvals Response:\n' + JSON.stringify(data, null, 2);
                console.log('Pending Approvals:', data);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
